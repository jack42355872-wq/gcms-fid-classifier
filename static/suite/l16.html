<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><script src="bridge.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>L16 最佳化工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：左側步驟導覽 + 右側依序排列的八個步驟；手機寬度時導覽變成橫向捲動列 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaf0ee; --ink:#16201e; --muted:#58645f; --line:#d3dcd9;
  --accent:#1c6680; --accent-ink:#ffffff; --accent-soft:#deedf2; --c2:#b5561d; --c2-soft:#f6e6db;
  --good:#2b7a4b; --good-soft:#e1f1e7; --warn:#9a6300; --warn-soft:#f7ecd5; --bad:#ad3536; --bad-soft:#f7e0df;
  --hl:#fff3b0;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#161d1c; --surface-2:#1e2826; --ink:#e3ebe8; --muted:#98a6a1; --line:#2c3835;
  --accent:#62b2cf; --accent-ink:#0b1416; --accent-soft:#16303a; --c2:#e28a50; --c2-soft:#3a2518;
  --good:#5fbf86; --good-soft:#163323; --warn:#e2a948; --warn-soft:#3a2c12; --bad:#e57373; --bad-soft:#3d1c1c; --hl:#4a4113; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#161d1c; --surface-2:#1e2826; --ink:#e3ebe8; --muted:#98a6a1; --line:#2c3835;
  --accent:#62b2cf; --accent-ink:#0b1416; --accent-soft:#16303a; --c2:#e28a50; --c2-soft:#3a2518;
  --good:#5fbf86; --good-soft:#163323; --warn:#e2a948; --warn-soft:#3a2c12; --bad:#e57373; --bad-soft:#3d1c1c; --hl:#4a4113; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--font-display);font-size:1.75rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;border-radius:0;padding:3px 14px;font-size:.82rem;background:transparent;color:var(--muted)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.status{font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;margin-top:20px}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.steps a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.92rem;line-height:1.35}
nav.steps a b{font-family:var(--font-mono);font-weight:500;color:var(--accent);min-width:1.2em}
nav.steps a:hover,nav.steps a:focus-visible{background:var(--surface-2);color:var(--ink);outline:none}
main{display:flex;flex-direction:column;gap:22px;min-width:0}
section.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;min-width:0;scroll-margin-top:16px}
section.step>h2{font-family:var(--font-display);font-size:1.3rem;margin:0 0 4px;display:flex;gap:12px;align-items:baseline}
section.step>h2 .no{font-family:var(--font-mono);font-size:.95rem;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:72ch}
.how{background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:.92rem;max-width:80ch}
.how b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:10px 0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=number],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:96px;font-family:var(--font-mono);font-size:.9rem}
input.sm{width:72px}
textarea{width:100%;min-height:140px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--font-mono);font-size:.82rem}
button{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--surface-2);font-weight:500;color:var(--muted);text-align:right}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
td.num,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td.best{background:var(--accent-soft);color:var(--accent);font-weight:600}
td.hit{background:var(--hl)}
.neg{color:var(--bad)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details>summary{cursor:pointer;color:var(--accent);font-size:.9rem;list-style:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}
.formula{font-family:var(--font-mono);font-size:.88rem;background:var(--surface-2);border-radius:6px;padding:8px 12px;margin:6px 0;overflow-x:auto;white-space:pre}
.calc{font-family:var(--font-mono);font-size:.84rem;line-height:1.7;overflow-x:auto;white-space:pre}
.result{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin:10px 0}
.result .big{font-family:var(--font-mono);font-size:1.25rem;font-weight:500;color:var(--accent)}
.result .k{font-size:.8rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:8px 0}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:8px 0}
.plot{width:100%;min-height:320px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}nav.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}nav.steps a{white-space:nowrap}.grid2{grid-template-columns:minmax(0,1fr)}.side{align-items:flex-start}.status{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i="title"></h1>
      <p data-i="intro"></p>
    </div>
    <div class="side">
      <div class="lang" role="group" data-i-aria="langAria">
        <button type="button" id="langZh" lang="zh-Hant">中文</button><button type="button" id="langEn" lang="en">English</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" data-i-aria="navAria">
      <a href="#s1"><b>1</b><span data-i="n1"></span></a>
      <a href="#s2"><b>2</b><span data-i="n2"></span></a>
      <a href="#s3"><b>3</b><span data-i="n3"></span></a>
      <a href="#s4"><b>4</b><span data-i="n4"></span></a>
      <a href="#s5"><b>5</b><span data-i="n5"></span></a>
      <a href="#s6"><b>6</b><span data-i="n6"></span></a>
      <a href="#s7"><b>7</b><span data-i="n7"></span></a>
      <a href="#s8"><b>8</b><span data-i="n8"></span></a>
    </nav>

    <main>
      <!-- STEP 1 -->
      <section class="step" id="s1">
        <h2><span class="no">1</span><span data-i="s1h"></span></h2>
        <p class="lead" data-i="s1lead"></p>
        <div class="how" data-ih="s1how"></div>
        <div class="row">
          <button class="primary" id="btnLoadExample" data-i="btnLoadExample"></button>
          <span class="note" id="dataSource"></span>
        </div>
        <details id="pasteBox">
          <summary data-i="pasteSummary"></summary>
          <textarea id="pasteArea" spellcheck="false"></textarea>
          <div class="row"><button class="primary" id="btnApplyPaste" data-i="btnApplyPaste"></button><span id="pasteMsg" class="note"></span></div>
        </details>
        <h3 style="font-size:1rem;margin:16px 0 4px" data-i="s1fac"></h3>
        <p class="note" style="margin:0" data-i="s1facNote"></p>
        <div class="tbl"><table id="tblFactors"></table></div>
        <h3 style="font-size:1rem;margin:16px 0 4px" data-i="s1resp"></h3>
        <p class="note" style="margin:0" data-i="s1respNote"></p>
        <div class="tbl"><table id="tblResponses"></table></div>
        <h3 style="font-size:1rem;margin:16px 0 4px" data-i="s1data"></h3>
        <div class="tbl" id="tblDataWrap"><table id="tblData"></table></div>
      </section>

      <!-- STEP 2 -->
      <section class="step" id="s2">
        <h2><span class="no">2</span><span data-i="s2h"></span></h2>
        <p class="lead" data-i="s2lead"></p>
        <div class="how" data-ih="s2how"></div>
        <div class="row"><label class="f" for="s2resp"><span data-i="lblResp"></span><select id="s2resp"></select></label></div>
        <div class="tbl"><table id="tblMain"></table></div>
        <div id="plotMain" class="plot" style="min-height:260px"></div>
        <details><summary data-i="s2details"></summary><div class="tbl"><table id="tblMainIdx"></table></div></details>
      </section>

      <!-- STEP 3 -->
      <section class="step" id="s3">
        <h2><span class="no">3</span><span data-i="s3h"></span></h2>
        <p class="lead" data-i="s3lead"></p>
        <div class="how" data-ih="s3how"></div>
        <div class="tbl"><table id="tblR2"></table></div>
        <div class="row"><label class="f" for="s3resp"><span data-i="s3pick"></span><select id="s3resp"></select></label></div>
        <div id="s3err"></div>
        <div class="grid2">
          <div style="min-width:0">
            <h3 style="font-size:1rem;margin:6px 0" data-i="s3coef"></h3>
            <div class="tbl"><table id="tblCoef"></table></div>
            <p class="note" id="coefNote"></p>
          </div>
          <div style="min-width:0"><div id="plotParity" class="plot" style="min-height:300px"></div></div>
        </div>
        <details><summary data-i="s3codeSum"></summary>
          <div class="formula" data-i="s3codeFormula"></div>
          <div class="tbl"><table id="tblCoding"></table></div>
          <div id="shortcutBox"></div>
        </details>
        <details><summary data-i="s3runsSum"></summary>
          <p class="note" data-i="s3runsNote"></p>
          <div class="tbl"><table id="tblRuns"></table></div>
        </details>
      </section>

      <!-- STEP 4 -->
      <section class="step" id="s4">
        <h2><span class="no">4</span><span data-i="s4h"></span></h2>
        <p class="lead" data-i="s4lead"></p>
        <div class="row" id="s4inputs"></div>
        <div class="tbl"><table id="tblPredict"></table></div>
        <details><summary data-i="s4calcSum"></summary>
          <div class="row"><label class="f" for="s4resp"><span data-i="lblResp"></span><select id="s4resp"></select></label></div>
          <div class="calc" id="s4calc"></div>
        </details>
      </section>

      <!-- STEP 5 -->
      <section class="step" id="s5">
        <h2><span class="no">5</span><span data-i="s5h"></span></h2>
        <p class="lead" data-i="s5lead"></p>
        <div class="how" data-ih="s5how"></div>
        <div class="tbl"><table id="tblWeights"></table></div>
        <div id="s5out"></div>
      </section>

      <!-- STEP 6 -->
      <section class="step" id="s6">
        <h2><span class="no">6</span><span data-i="s6h"></span></h2>
        <p class="lead" data-i="s6lead"></p>
        <div class="how" data-ih="s6how"></div>
        <div class="row">
          <label class="f" for="s6obj"><span data-i="s6obj"></span><select id="s6obj"></select></label>
          <label class="f" for="s6objDir"><span data-i="s6goal"></span><select id="s6objDir"><option value="max" data-i="optMax"></option><option value="min" data-i="optMin"></option></select></label>
          <label class="f" for="s6con"><span data-i="s6con"></span><select id="s6con"></select></label>
          <label class="f" for="s6conOp"><span data-i="s6limit"></span><select id="s6conOp"><option value="le" data-i="optLe"></option><option value="ge" data-i="optGe"></option></select></label>
        </div>
        <h3 style="font-size:1rem;margin:10px 0 4px" data-i="s6range"></h3>
        <div class="tbl"><table id="tblRange"></table></div>
        <h3 style="font-size:1rem;margin:10px 0 4px" data-i="s6extra"></h3>
        <div id="extraBox"></div>
        <div class="row"><button id="btnAddExtra" data-i="btnAddExtra"></button><button class="primary" id="btnPareto" data-i="btnPareto"></button><span class="note" id="paretoMsg"></span></div>
        <div id="s6warn"></div>
        <div id="s6res" hidden>
          <div id="plotPareto" class="plot" style="min-height:360px"></div>
          <div class="row" style="align-items:center">
            <label class="f" for="epsSlider" style="flex:1 1 280px"><span data-i="s6slider"></span><input type="range" id="epsSlider" min="0" max="1" step="1" style="width:100%"></label>
            <button id="btnKnee" data-i="btnKnee"></button>
          </div>
          <div id="s6pick"></div>
          <details><summary data-i="s6frontSum"></summary><div class="tbl"><table id="tblFront"></table></div></details>
        </div>
      </section>

      <!-- STEP 7 -->
      <section class="step" id="s7">
        <h2><span class="no">7</span><span data-i="s7h"></span></h2>
        <p class="lead" data-i="s7lead"></p>
        <div class="how" data-ih="s7how"></div>
        <div class="row">
          <label class="f" for="s7resp"><span data-i="lblResp"></span><select id="s7resp"></select></label>
          <label class="f" for="s7x"><span data-i="s7x"></span><select id="s7x"></select></label>
          <label class="f" for="s7y"><span data-i="s7y"></span><select id="s7y"></select></label>
          <span id="s7fixed" class="row" style="margin:0"></span>
          <button id="btnUseOpt" data-i="btnUseOpt"></button>
        </div>
        <div id="plotContour" class="plot" style="min-height:420px"></div>
        <h3 style="font-size:.95rem;margin:10px 0 2px" data-i="s7formulaH"></h3>
        <div class="formula" id="s7formula"></div>
        <p class="note" id="s7formulaNote"></p>
        <div class="calc" id="s7calc"></div>
      </section>

      <!-- STEP 8 -->
      <section class="step" id="s8">
        <h2><span class="no">8</span><span data-i="s8h"></span></h2>
        <p class="lead" data-i="s8lead"></p>
        <div class="how" data-ih="s8how"></div>
        <div class="tbl"><table id="tblVcond"></table></div>
        <div class="tbl"><table id="tblVal"></table></div>
        <div id="s8out"></div>
      </section>

      <section class="step" id="s9">
        <h2><span class="no">↧</span><span data-i="s9h"></span></h2>
        <p class="lead" data-i="s9lead"></p>
        <div class="copyrow"><button class="primary" id="btnExport" data-i="btnExport"></button><button id="btnCopy" data-i="btnCopy"></button><span id="copyMsg" class="note"></span></div>
        <textarea id="exportArea" readonly style="margin-top:8px"></textarea>
        <p class="note" data-i="s9refs"></p>
      </section>
    </main>
  </div>
</div>

<script>
/* ---------- 介面文字（中文 / English） ---------- */
const I18N = {
zh: {
  title: 'L16 最佳化工作台',
  intro: '貼上正交實驗數據，依序做主效應、二階模型、加權篩選、約束最佳化與等高線分析。每一步都列出中間數字和白話說明。',
  langAria: '介面語言', navAria: '分析步驟',
  n1: '數據', n2: '主效應', n3: '二階模型', n4: '單點預測', n5: '加權篩選', n6: '約束最佳化', n7: '等高線', n8: '驗證比較',
  s1h: '數據',
  s1lead: '每一列是一組實驗：4 個操作參數，加上你量到的各項指標。可以直接從 Excel 複製貼上。',
  s1how: '<b>格式：</b>第一列是標題。第 1 欄是編號，第 2～5 欄是四個操作參數，第 6 欄以後每欄一個指標（例如 CO₂ 轉化率、CH₄ 產率）。欄位用 Tab（Excel 複製時就是）或逗號分隔。',
  btnLoadExample: '載入範例數據', pasteSummary: '貼上自己的數據', btnApplyPaste: '套用貼上的數據',
  pastePh: '編號\tT (℃)\tP (bar)\tGHSV (hr⁻¹)\tH₂/CO₂\tCO₂ 轉化率 (%)\tCH₄ 產率 (%)\nT1\t300\t10\t1200\t2.5\t36.98\t4.96',
  s1fac: '操作參數', s1facNote: '「搜尋步距」用在第 6 步的網格搜尋，數字越小越細、算越久。',
  s1resp: '指標設定', s1respNote: '「方向」決定最佳化時要越大越好還是越小越好。「取對數」適合只會是正值、而且數值跨度大的指標（例如 CH₄ 產率）。',
  s1data: '目前的數據',
  s2h: '主效應',
  s2lead: '先不管模型，直接看每個參數在每個水準的平均表現。這是最原始、最不需要假設的看法。',
  s2how: '<b>怎麼算：</b>例如「T = 300 ℃ 的平均」，就是把所有 T = 300 ℃ 的實驗結果加起來除以組數。L16 的每個水準剛好各有 4 組，而且另外三個參數在這 4 組裡各水準都出現一次，所以平均可以公平比較。<br><b>怎麼看：</b>Delta（最大平均 − 最小平均）越大，代表這個參數影響越大。',
  lblResp: '指標', s2details: '每個平均是哪幾組算出來的',
  s3h: '二階模型與預測能力',
  s3lead: '把每個指標寫成一條公式，才能預測「沒做過的條件」。但公式要先通過預測能力的檢查，才能拿來最佳化。',
  s3how: '<b>模型長這樣：</b>指標 = 常數 b₀ + T 的效應 + P 的效應 + GHSV 的效應 + H₂/CO₂ 的效應。每個效應都是一條拋物線（一次項 + 二次項），所以能描述「先升後降」。<br><b>R² 是什麼：</b>16 組都拿來擬合時，公式能解釋多少變化。它一定會偏樂觀，因為公式看過這 16 組。<br><b>R²<sub>pred</sub> 是什麼：</b>每次故意拿掉 1 組，用其他 15 組建公式，再預測被拿掉的那組，重複 16 次。這就像用沒考過的題目來考，比較誠實。<br><b>判斷：</b>R²<sub>pred</sub> 是負的，代表公式預測新條件的能力比「直接猜平均值」還差，這個指標就不能拿來最佳化。',
  s3pick: '看哪個指標的細節', s3coef: '係數',
  s3codeSum: '參數怎麼換成編碼值 u，以及係數的手算過程',
  s3codeFormula: 'u = (實際值 − 中心值) ÷ (水準間距 ÷ 2)      → 四個水準變成 −3、−1、1、3\n效應 g = b₁ · u + b₂ · (u² − 5) ÷ 4\n在四個水準上：g(−3) = −3·b₁ + b₂　g(−1) = −b₁ − b₂　g(1) = b₁ − b₂　g(3) = 3·b₁ + b₂',
  s3runsSum: '每一組的模型值、殘差與留一預測',
  s3runsNote: '殘差 = 實測 − 模型值。留一預測 = 拿掉這組、用其餘各組建模後的預測值。槓桿值 h 代表這組離實驗中心多遠：越多參數落在最外側水準，h 越大（L16 介於 0.36～0.76）。留一誤差 = 殘差 ÷ (1 − h)，所以 h 越大，殘差被放大越多。',
  s4h: '單點預測', s4lead: '輸入任何一組操作條件，看公式怎麼一項一項加出預測值。', s4calcSum: '選一個指標看完整算式',
  s5h: '加權篩選',
  s5lead: '把幾個指標的主效應合成一個總分，每個參數挑總分最高的水準。結果一定落在做過的水準上。',
  s5how: '<b>為什麼要正規化：</b>CO₂ 轉化率的單位變化是幾十個百分點，CH₄ 產率只有幾個百分點，直接相加會被大的蓋過。所以每個指標先除以自己的最大 Delta，變成同一個尺度。<br><b>公式：</b>N = (水準平均 − 該參數四水準的平均) ÷ 該指標的最大 Delta；總分 = Σ 權重 × 方向 × N（望小的指標方向取 −1）。',
  s6h: '約束最佳化',
  s6lead: '用第 3 步的公式，在範圍內每個網格點都算一次，找出「在某個指標不超過上限的前提下，另一個指標最好」的條件。',
  s6how: '<b>問題：</b>讓「目標」最好，同時「取捨指標」不能超過 ε。<br><b>Pareto 前緣：</b>把 ε 從嚴到鬆掃一遍，每個 ε 的最佳點連起來就是前緣。前緣上的點都是「沒辦法兩個都更好」的條件。<br><b>轉折點：</b>兩軸各自縮放到 0～1 後，離前緣兩端連線最遠的點。過了這點，目標只能再多一點點，取捨指標卻要犧牲很多。',
  s6obj: '目標', s6goal: '要', optMax: '越大越好', optMin: '越小越好', s6con: '取捨指標', s6limit: '限制', optLe: '不超過 ε（≤）', optGe: '不低於 ε（≥）',
  s6range: '搜尋範圍', s6extra: '其他約束（選填）', btnAddExtra: '新增約束', btnPareto: '計算 Pareto 前緣',
  s6slider: '沿著前緣移動（ε）', btnKnee: '回到轉折點', s6frontSum: '前緣上的代表點',
  s7h: '等高線',
  s7lead: '固定兩個參數，畫另外兩個參數變化時的模型曲面，並把 16 組實驗點放上去，看模型和數據合不合。',
  s7how: '<b>實驗點怎麼放：</b>大部分實驗的固定參數和切面不同，不能直接拿實測值比。所以把每組換到切面條件：<br><span class="num">校正值 = 切面上的模型值 + 殘差</span>，殘差 = 實測 − 該組自己條件的模型值。<br>意思是：這組實測比模型高多少，就假設到了切面條件也高多少。點的顏色和底色越接近，模型在那裡越準。點一下實驗點可以看算式。',
  s7x: '橫軸', s7y: '縱軸', btnUseOpt: '固定值改用第 6 步選的點', s7formulaH: '這張圖的公式（實際單位）',
  s8h: '驗證比較', s8lead: '做完驗證實驗後，填入實測值，和模型預測比較。',
  s8how: '<b>建議同時跑一個對照條件。</b>觸媒批次或活化程序改變時，所有條件的數值可能整體偏高或偏低，絕對值會和模型差很多。比較「最佳條件 − 對照條件」的差距，比直接比絕對值可靠。<br><b>怎麼判斷：</b>預測誤差的參考值用第 3 步的留一 RMSE。差距在 2 倍 RMSE 以內，可以說和模型一致。',
  s9h: '匯出', s9lead: '把目前的數據、設定和主要結果整理成文字，可貼回 Excel 或存檔。', btnExport: '產生匯出文字', btnCopy: '複製',
  s9refs: '方法出處：主效應與正交表（Phadke, 1989）；二階模型與預測 R²（Montgomery, Design and Analysis of Experiments；Myers et al., 2016）；PRESS（Allen, 1974）；對數轉換（Box & Cox, 1964）；加權合併與 ε-約束（Marler & Arora, 2004；Haimes et al., 1971）；轉折點（Satopää et al., 2011）；部分殘差（Larsen & McCleary, 1972）。',

en: {
  title: 'L16 Optimization Workbench',
  intro: 'Paste orthogonal-array data and work through main effects, a quadratic model, weighted screening, constrained optimization and contour plots. Every step shows the intermediate numbers with a plain-language explanation.',
  langAria: 'Interface language', navAria: 'Analysis steps',
  n1: 'Data', n2: 'Main effects', n3: 'Quadratic model', n4: 'Point prediction', n5: 'Weighted screening', n6: 'Constrained optimization', n7: 'Contour plot', n8: 'Validation',
  s1h: 'Data',
  s1lead: 'Each row is one run: 4 operating parameters plus the responses you measured. You can copy and paste straight from Excel.',
  s1how: '<b>Format:</b> The first row is the header. Column 1 is the run ID, columns 2–5 are the four operating parameters, and every column from 6 on is one response (e.g., CO₂ conversion, CH₄ yield). Separate columns with tabs (what Excel copies) or commas.',
  btnLoadExample: 'Load example data', pasteSummary: 'Paste your own data', btnApplyPaste: 'Apply pasted data',
  pastePh: 'Run\tT (℃)\tP (bar)\tGHSV (hr⁻¹)\tH₂/CO₂\tCO₂ conversion (%)\tCH₄ yield (%)\nT1\t300\t10\t1200\t2.5\t36.98\t4.96',
  s1fac: 'Operating parameters', s1facNote: '"Search step" is used by the grid search in step 6. Smaller steps are finer but slower.',
  s1resp: 'Response settings', s1respNote: '"Direction" sets whether larger or smaller is better during optimization. "Log" suits responses that are always positive and span a wide range (e.g., CH₄ yield).',
  s1data: 'Current data',
  s2h: 'Main effects',
  s2lead: 'Before any model, look at the average result at each level of each parameter. This is the most direct view and needs no assumptions.',
  s2how: '<b>How it is calculated:</b> For example, "the mean at T = 300 ℃" is the sum of all runs at T = 300 ℃ divided by the number of runs. In L16 each level has exactly 4 runs, and within those 4 runs each of the other three parameters takes every level once, so the means can be compared fairly.<br><b>How to read it:</b> The larger the Delta (largest mean − smallest mean), the stronger the parameter\'s effect.',
  lblResp: 'Response', s2details: 'Which runs each mean comes from',
  s3h: 'Quadratic model and predictive ability',
  s3lead: 'Writing each response as a formula lets you predict conditions you have not run. The formula must first pass a check of predictive ability before it can be used for optimization.',
  s3how: '<b>The model:</b> response = constant b₀ + effect of T + effect of P + effect of GHSV + effect of H₂/CO₂. Each effect is a parabola (linear + quadratic term), so it can describe a rise followed by a fall.<br><b>What R² means:</b> how much of the variation the formula explains when all 16 runs are used to fit it. It is always optimistic, because the formula has already seen these 16 runs.<br><b>What R²<sub>pred</sub> means:</b> leave out 1 run, build the formula from the other 15, predict the run that was left out, and repeat 16 times. It is like testing with questions the formula has never seen, so it is a more honest score.<br><b>Rule:</b> a negative R²<sub>pred</sub> means the formula predicts new conditions worse than simply guessing the mean, so that response cannot be used for optimization.',
  s3pick: 'Show details for', s3coef: 'Coefficients',
  s3codeSum: 'How parameters become coded values u, and the hand calculation of the coefficients',
  s3codeFormula: 'u = (actual value − center) ÷ (level spacing ÷ 2)      → the four levels become −3, −1, 1, 3\neffect g = b₁ · u + b₂ · (u² − 5) ÷ 4\nat the four levels: g(−3) = −3·b₁ + b₂   g(−1) = −b₁ − b₂   g(1) = b₁ − b₂   g(3) = 3·b₁ + b₂',
  s3runsSum: 'Model value, residual and leave-one-out prediction for each run',
  s3runsNote: 'Residual = measured − model value. Leave-one-out (LOO) prediction = the prediction for this run from a model built on all the other runs. Leverage h measures how far the run sits from the design center: the more parameters at an outermost level, the larger h (0.36–0.76 in L16). LOO error = residual ÷ (1 − h), so a larger h inflates the residual more.',
  s4h: 'Point prediction', s4lead: 'Enter any set of operating conditions and see how the formula adds up the prediction term by term.', s4calcSum: 'Pick a response to see the full calculation',
  s5h: 'Weighted screening',
  s5lead: 'Combine the main effects of several responses into one total score, then pick the level with the highest score for each parameter. The result always lands on a level that was actually run.',
  s5how: '<b>Why normalize:</b> CO₂ conversion changes by tens of percentage points while CH₄ yield changes by only a few, so adding them directly lets the larger one dominate. Each response is first divided by its own largest Delta to put all responses on the same scale.<br><b>Formula:</b> N = (level mean − mean of that parameter\'s four levels) ÷ largest Delta of that response; score = Σ weight × direction × N (direction = −1 for smaller-is-better responses).',
  s6h: 'Constrained optimization',
  s6lead: 'Using the formulas from step 3, evaluate every grid point in the search range and find the conditions where one response is best while another stays within a limit.',
  s6how: '<b>Problem:</b> make the "objective" as good as possible while the "trade-off response" stays within ε.<br><b>Pareto front:</b> sweep ε from strict to loose; joining the best point for each ε gives the front. Every point on the front is a condition where you cannot improve both responses at once.<br><b>Knee point:</b> after scaling both axes to 0–1, the point farthest from the line joining the two ends of the front. Beyond this point the objective gains only a little while the trade-off response gets much worse.',
  s6obj: 'Objective', s6goal: 'Goal', optMax: 'Maximize', optMin: 'Minimize', s6con: 'Trade-off response', s6limit: 'Limit', optLe: 'At most ε (≤)', optGe: 'At least ε (≥)',
  s6range: 'Search range', s6extra: 'Other constraints (optional)', btnAddExtra: 'Add constraint', btnPareto: 'Compute Pareto front',
  s6slider: 'Move along the front (ε)', btnKnee: 'Back to knee point', s6frontSum: 'Representative points on the front',
  s7h: 'Contour plot',
  s7lead: 'Fix two parameters, plot the model surface as the other two vary, and overlay the 16 runs to see whether the model and the data agree.',

<script>
/* ===== 計算核心（不碰畫面） ===== */
const Core = (() => {
  const NB = 9; // 1 + 4 linear + 4 quadratic
  function factorCoding(factors) {
    return factors.map(f => {
      const lv = f.levels.slice().sort((a, b) => a - b);
      const lo = lv[0], hi = lv[lv.length - 1];
      return { center: (lo + hi) / 2, half: (hi - lo) / 6 };
    });
  }
  function codeRow(x, coding) { return x.map((v, j) => (v - coding[j].center) / coding[j].half); }
  function basis(u) { const r = [1]; for (const v of u) r.push(v); for (const v of u) r.push((v * v - 5) / 4); return r; }
  function invert(M) {
    const n = M.length, A = M.map((r, i) => [...r, ...Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))]);
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      if (Math.abs(A[p][c]) < 1e-10) return null;
      [A[c], A[p]] = [A[p], A[c]];
      const d = A[c][c]; for (let k = 0; k < 2 * n; k++) A[c][k] /= d;
      for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c]; if (f) for (let k = 0; k < 2 * n; k++) A[r][k] -= f * A[c][k]; }
    }
    return A.map(r => r.slice(n));
  }
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  function fitModel(X, y, factors, useLog) {
    const n = y.length, coding = factorCoding(factors);
    if (y.some(v => !(isFinite(v)))) return { error: '有空白或非數字的數值', code: 'nonnum' };
    if (useLog && y.some(v => v <= 0)) return { error: '取對數時數值必須大於 0', code: 'logpos' };
    const t = useLog ? y.map(Math.log) : y.slice();
    const A = X.map(x => basis(codeRow(x, coding)));
    const AtA = Array.from({ length: NB }, (_, i) => Array.from({ length: NB }, (_, j) => A.reduce((s, r) => s + r[i] * r[j], 0)));
    const inv = invert(AtA);
    if (!inv) return { error: '數據不足以估計模型（每個參數至少需要 3 個不同水準，且組數至少 10 組）', code: 'singular' };
    const Aty = Array.from({ length: NB }, (_, i) => A.reduce((s, r, k) => s + r[i] * t[k], 0));
    const b = inv.map(r => dot(r, Aty));
    const fitT = A.map(r => dot(r, b));
    const h = A.map(r => dot(r, inv.map(row => dot(row, r))));
    const looT = t.map((v, i) => v - (v - fitT[i]) / (1 - h[i]));
    const back = v => (useLog ? Math.exp(v) : v);
    const fit = fitT.map(back), loo = looT.map(back);
    const ybar = y.reduce((s, v) => s + v, 0) / n;
    const sst = y.reduce((s, v) => s + (v - ybar) ** 2, 0);
    const sse = y.reduce((s, v, i) => s + (v - fit[i]) ** 2, 0);
    const press = y.reduce((s, v, i) => s + (v - loo[i]) ** 2, 0);
    return { b, coding, useLog, fit, loo, h, residT: t.map((v, i) => v - fitT[i]), resid: y.map((v, i) => v - fit[i]),
      R2: 1 - sse / sst, R2pred: 1 - press / sst, rmse: Math.sqrt(sse / n), rmseLoo: Math.sqrt(press / n), n, ybar };
  }
  // 單一參數的效應 g_f(x) = b1·u + b2·(u²−5)/4
  function effect(m, j, xj) { const u = (xj - m.coding[j].center) / m.coding[j].half; return m.b[1 + j] * u + m.b[5 + j] * (u * u - 5) / 4; }
  function predictT(m, x) { let s = m.b[0]; for (let j = 0; j < 4; j++) s += effect(m, j, x[j]); return s; }
  function predict(m, x) { const v = predictT(m, x); return m.useLog ? Math.exp(v) : v; }
  function breakdown(m, x) {
    const terms = [0, 1, 2, 3].map(j => ({ j, u: (x[j] - m.coding[j].center) / m.coding[j].half, b1: m.b[1 + j], b2: m.b[5 + j], g: effect(m, j, x[j]) }));
    const sumT = m.b[0] + terms.reduce((s, t) => s + t.g, 0);
    return { b0: m.b[0], terms, sumT, value: m.useLog ? Math.exp(sumT) : sumT };
  }
  // 水準平均
  function uniqueLevels(X, j) { return [...new Set(X.map(r => r[j]))].sort((a, b) => a - b); }
  function levelMeans(X, y, j) {
    const lv = uniqueLevels(X, j);
    return lv.map(L => { const idx = X.map((r, i) => (r[j] === L ? i : -1)).filter(i => i >= 0); return { level: L, idx, mean: idx.reduce((s, i) => s + y[i], 0) / idx.length }; });
  }
  // 正交多項式手算捷徑（僅適用：4 個等間距水準、各水準組數相同）
  function shortcut(X, y, j) {
    const lm = levelMeans(X, y, j); if (lm.length !== 4) return null;
    const cnt = lm.map(l => l.idx.length); if (cnt.some(c => c !== cnt[0])) return null;
    const d = lm[1].level - lm[0].level; if (Math.abs((lm[2].level - lm[1].level) - d) > 1e-9 || Math.abs((lm[3].level - lm[2].level) - d) > 1e-9) return null;
    const m = lm.map(l => l.mean);
    return { m, b1: (-3 * m[0] - m[1] + m[2] + 3 * m[3]) / 20, b2: (m[0] - m[1] - m[2] + m[3]) / 4 };
  }
  // 加權合併（主效應篩選）
  function screening(X, Ys, items) { // items: [{k, w, sign}]
    const per = items.map(it => {
      const y = Ys[it.k];
      const lms = [0, 1, 2, 3].map(j => levelMeans(X, y, j));
      const deltas = lms.map(l => Math.max(...l.map(z => z.mean)) - Math.min(...l.map(z => z.mean)));
      const dmax = Math.max(...deltas);
      const N = lms.map(l => { const avg = l.reduce((s, z) => s + z.mean, 0) / l.length; return l.map(z => (z.mean - avg) / dmax); });
      return { ...it, lms, deltas, dmax, N };
    });
    const levels = [0, 1, 2, 3].map(j => uniqueLevels(X, j));
    const score = levels.map((lv, j) => lv.map((_, k) => per.reduce((s, p) => s + p.w * p.sign * p.N[j][k], 0)));
    const best = score.map((row, j) => levels[j][row.indexOf(Math.max(...row))]);
    return { per, levels, score, best };
  }
  // 網格
  function gridAxis(lo, hi, step) { const out = []; const n = Math.floor((hi - lo) / step + 1e-9); for (let k = 0; k <= n; k++) out.push(Math.round((lo + k * step) * 1e6) / 1e6); if (out[out.length - 1] < hi - 1e-9) out.push(hi); return out; }
  // Pareto：目標 obj（max/min），取捨約束 con（le/ge），其他約束 extra
  function pareto(models, obj, con, ranges, extra) {
    const ax = ranges.map(r => gridAxis(r.lo, r.hi, r.step));
    const total = ax.reduce((s, a) => s * a.length, 1);
    if (total > 2.5e6) return { error: `網格點太多（${total.toLocaleString()} 點），請加大步距或縮小範圍`, code: 'grid', total };
    const pts = []; const x = [0, 0, 0, 0];
    for (const a of ax[0]) for (const b of ax[1]) for (const c of ax[2]) for (const d of ax[3]) {
      x[0] = a; x[1] = b; x[2] = c; x[3] = d;
      let ok = true;
      for (const e of extra) { const v = predict(models[e.k], x); if (e.op === 'ge' ? v < e.val : v > e.val) { ok = false; break; } }
      if (!ok) continue;
      const fo = predict(models[obj.k], x), fc = predict(models[con.k], x);
      pts.push({ x: [a, b, c, d], fo, fc, gain: obj.dir === 'max' ? fo : -fo, cost: con.op === 'le' ? fc : -fc });
    }
    if (!pts.length) return { error: '在設定的範圍與約束下沒有可行的條件', code: 'infeasible' };
    pts.sort((p, q) => p.cost - q.cost || q.gain - p.gain);
    const front = []; let bestGain = -Infinity;
    for (const p of pts) if (p.gain > bestGain + 1e-12) { front.push(p); bestGain = p.gain; }
    const cmin = front[0].cost, cmax = front[front.length - 1].cost, gmin = front[0].gain, gmax = front[front.length - 1].gain;
    let kneeIdx = 0, best = -Infinity;
    front.forEach((p, i) => { const s = (cmax > cmin ? (p.gain - gmin) / (gmax - gmin) : 0) - (cmax > cmin ? (p.cost - cmin) / (cmax - cmin) : 0); if (s > best) { best = s; kneeIdx = i; } });
    return { front, kneeIdx, nGrid: total, nFeasible: pts.length, axes: ax };
  }
  function atEpsilon(res, epsCost) { let k = -1; res.front.forEach((p, i) => { if (p.cost <= epsCost + 1e-12) k = i; }); return k; }
  // 校正到切面的實驗點：校正值 = 切面模型值 + 殘差（對數模型在 ln 尺度上做）
  function adjustedPoint(m, X, i, fixedX, fx, fy) {
    const xs = fixedX.slice(); xs[fx] = X[i][fx]; xs[fy] = X[i][fy];
    const t = predictT(m, xs) + m.residT[i];
    return { xs, value: m.useLog ? Math.exp(t) : t, sliceModel: predict(m, xs) };
  }
  return { fitModel, predict, predictT, breakdown, effect, levelMeans, uniqueLevels, shortcut, screening, pareto, atEpsilon, gridAxis, adjustedPoint, factorCoding };
})();
if (typeof module !== 'undefined') module.exports = Core;

</script>

function fname(j) { const f = S.factors[j]; return f.unit ? `${f.name} (${f.unit})` : f.name; }

function errText(m) {

function parsePaste(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 11) throw new Error(T('errMinRows'));
  const split = l => (l.includes('\t') ? l.split('\t') : l.split(',')).map(s => s.trim());
  const head = split(lines[0]);
  if (head.length < 6) throw new Error(T('errCols'));
  const rows = lines.slice(1).map(split);
  const nResp = head.length - 5;
  const X = [], Y = Array.from({ length: nResp }, () => []), ids = [];
  rows.forEach((r, i) => {
    if (r.length < head.length) throw new Error(T('errRowCols', i + 2));
    ids.push(r[0] || `R${i + 1}`);
    const x = r.slice(1, 5).map(Number);
    if (x.some(v => !isFinite(v))) throw new Error(T('errRowParam', i + 2));
    X.push(x);
    for (let k = 0; k < nResp; k++) { const v = Number(r[5 + k]); if (!isFinite(v)) throw new Error(T('errRowVal', i + 2, head[5 + k])); Y[k].push(v); }
  });
  for (let j = 0; j < 4; j++) if (new Set(X.map(r => r[j])).size < 3) throw new Error(T('errLevels', head[1 + j]));
  const parseName = s => { const m = s.match(/^(.*?)\s*[\(（]([^\)）]*)[\)）]\s*$/); return m ? { name: m[1], unit: m[2] } : { name: s, unit: '' }; };
  const factors = head.slice(1, 5).map((h, j) => { const p = parseName(h); const lv = [...new Set(X.map(r => r[j]))].sort((a, b) => a - b); const span = lv[lv.length - 1] - lv[0]; return { ...p, step: +(span / 60).toPrecision(2) }; });
  const responses = head.slice(5).map(h => ({ ...parseName(h), dir: 'max', log: false }));
  return { source: '', factors, responses, ids, X, Y, weights: responses.map((_, k) => (k < 2 ? 1 : 0)), ranges: null, extra: [], obj: 0, con: Math.min(1, responses.length - 1), objDir: 'max', conOp: 'le', s7: { resp: 0, x: 2, y: 1, fixed: null }, val: null };
}

  const names = [T('vBest'), T('vRef')];
  $('tblVcond').innerHTML = `<tr><th>${T('thCond')}</th>` + [0, 1, 2, 3].map(j => `<th>${esc(fname(j))}</th>`).join('') + '</tr>' + V.cond.map((c, n) => `<tr><td>${names[n]}${n === 0 ? ` <button id="vUseOpt">${T('vUseOpt')}</button>` : ''}</td>` + c.map((v, j) => `<td><input type="number" id="vc${n}_${j}" step="any" value="${v}" aria-label="${esc(names[n] + ' ' + fname(j))}"></td>`).join('') + '</tr>').join('');
  V.cond.forEach((c, n) => c.forEach((_, j) => $(`vc${n}_${j}`).onchange = e => { const v = parseFloat(e.target.value); if (isFinite(v)) { c[j] = v; V.touched = true; save(); renderS8(); } }));
  $('vUseOpt').onclick = () => { if (pickX) { V.cond[0] = pickX.slice(); V.touched = true; save(); renderS8(); } };
  let h = `<tr><th>${T('thResp')}</th><th>${T('thBP')}</th><th>${T('thBM')}</th><th>${T('thRP')}</th><th>${T('thRM')}</th><th>${T('thDP')}</th><th>${T('thDM')}</th><th>${T('thLooRmse')}</th><th>${T('thVerdict')}</th></tr>`;
  S.responses.forEach((r, k) => {
    const m = M[k]; if (!m || m.error) return;
    const p0 = Core.predict(m, V.cond[0]), p1 = Core.predict(m, V.cond[1]);
    const v0 = parseFloat(V.meas[0][k]), v1 = parseFloat(V.meas[1][k]);
    const dP = p0 - p1, dM = (isFinite(v0) && isFinite(v1)) ? v0 - v1 : NaN;
    const tol = 2 * m.rmseLoo * Math.SQRT2;
    let judge = `<span class="muted">${T('jWait')}</span>`;
    if (isFinite(dM)) judge = Math.abs(dM - dP) <= tol ? `<span class="pill good">${T('jDiffOk')}</span>` : `<span class="pill warn">${T('jDiffBad')}</span>`;
    else if (isFinite(v0)) judge = Math.abs(v0 - p0) <= 2 * m.rmseLoo ? `<span class="pill good">${T('jAbsOk')}</span>` : `<span class="pill warn">${T('jAbsBad')}</span>`;
    h += `<tr><td>${esc(rname(k))}</td><td class="num">${fmt(p0, 2)}</td><td><input type="number" id="vm0_${k}" class="sm" step="any" value="${V.meas[0][k]}" aria-label="${T('ariaVB')}"></td><td class="num">${fmt(p1, 2)}</td><td><input type="number" id="vm1_${k}" class="sm" step="any" value="${V.meas[1][k]}" aria-label="${T('ariaVR')}"></td><td class="num">${pm(dP)}</td><td class="num">${isFinite(dM) ? pm(dM) : '—'}</td><td class="num">${fmt(m.rmseLoo, 2)}</td><td>${judge}</td></tr>`;
  });
  $('tblVal').innerHTML = h;
  S.responses.forEach((r, k) => [0, 1].forEach(n => { const el = $(`vm${n}_${k}`); if (el) el.onchange = e => { V.meas[n][k] = e.target.value; save(); renderS8(); }; }));
  $('s8out').innerHTML = `<p class="note">${T('s8note')}</p>`;
}

/* ---------- 匯出 ---------- */
function exportText() {
  const L = [];
  L.push(T('exData')); L.push([T('thRun'), ...S.factors.map((_, j) => fname(j)), ...S.responses.map((_, k) => rname(k))].join('\t'));
  S.ids.forEach((id, i) => L.push([id, ...S.X[i], ...S.Y.map(y => y[i])].join('\t')));
  L.push(''); L.push(T('exModels')); L.push([T('thResp'), T('thModel'), 'R2', 'R2pred', 'RMSE', 'RMSE_LOO', 'b0', ...[0, 1, 2, 3].flatMap(j => [`b1_${S.factors[j].name}`, `b2_${S.factors[j].name}`])].join('\t'));
  S.responses.forEach((r, k) => { const m = M[k]; if (!m || m.error) return; L.push([rname(k), r.log ? 'ln' : 'linear', fmt(m.R2, 4), fmt(m.R2pred, 4), fmt(m.rmse, 4), fmt(m.rmseLoo, 4), fmt(m.b[0], 6), ...[0, 1, 2, 3].flatMap(j => [fmt(m.b[1 + j], 6), fmt(m.b[5 + j], 6)])].join('\t')); });
  if (paretoRes) {
    const p = paretoRes.front[pickIdx];
    L.push(''); L.push(T('exOpt', S.objDir, rname(S.obj), rname(S.con), S.conOp === 'le' ? '≤' : '≥'));
    L.push([T('exPick'), ...p.x].join('\t'));
    S.responses.forEach((r, k) => { const m = M[k]; if (m && !m.error) L.push([rname(k), fmt(Core.predict(m, p.x), 3)].join('\t')); });
  }
  return L.join('\n');
}

/* ---------- 語言切換 ---------- */
function setLang(l) {
  if (l === LANG) return;
  LANG = l;
  try { __LS.setItem(LANG_KEY, l); } catch (e) { }
  applyStatic(); localizeNames(); save();
  $('pasteMsg').textContent = ''; $('copyMsg').textContent = '';
  if ($('exportArea').value) $('exportArea').value = exportText();
  renderAll();
  if (paretoRes) { renderFrontTable(); $('paretoMsg').textContent = paretoDoneMsg(); }
}

/* ---------- 主流程 ---------- */
function renderAll() { $('s6res').hidden = !paretoRes; renderStatus(); renderFactors(); renderResponses(); renderData(); renderS2(); renderS3(); renderS4(); renderS5(); renderS6Controls(); if (paretoRes) { renderParetoPlot(); renderPick(); } renderS7(); renderS8(); }
function bind() {
  $('langZh').onclick = () => setLang('zh');
  $('langEn').onclick = () => setLang('en');
  $('btnLoadExample').onclick = () => { S = fromExample(); paretoRes = null; pickX = null; s4x = null; refit(); save(); renderAll(); runPareto(); };
  $('btnApplyPaste').onclick = () => { try { S = parsePaste($('pasteArea').value); paretoRes = null; pickX = null; s4x = null; s2k = s3k = s4k = 0; refit(); save(); renderAll(); $('pasteMsg').textContent = T('pasteOk', S.X.length, S.responses.length); $('paretoMsg').textContent = ''; $('s6res').hidden = true; } catch (e) { $('pasteMsg').textContent = T('pasteFail') + e.message; } };
  $('s2resp').onchange = e => { s2k = +e.target.value; renderS2(); };
  $('s3resp').onchange = e => { s3k = +e.target.value; renderS3(); };
  $('s4resp').onchange = e => { s4k = +e.target.value; renderS4(); };
  $('s6obj').onchange = e => { S.obj = +e.target.value; S.objDir = S.responses[S.obj].dir; save(); renderS6Controls(); };
  $('s6con').onchange = e => { S.con = +e.target.value; S.conOp = S.responses[S.con].dir === 'min' ? 'le' : 'ge'; save(); renderS6Controls(); };
  $('s6objDir').onchange = e => { S.objDir = e.target.value; save(); };
  $('s6conOp').onchange = e => { S.conOp = e.target.value; save(); };
  $('btnAddExtra').onclick = () => { S.extra.push({ k: 0, op: 'ge', val: 0 }); save(); renderExtra(); };
  $('btnPareto').onclick = runPareto;
  $('epsSlider').oninput = e => { pickIdx = +e.target.value; pickX = paretoRes.front[pickIdx].x.slice(); renderParetoPlot(); renderPick(); };
  $('epsSlider').onchange = () => { S.s7.fixed = pickX.slice(); renderS7(); };
  $('btnKnee').onclick = () => { pickIdx = paretoRes.kneeIdx; $('epsSlider').value = pickIdx; pickX = paretoRes.front[pickIdx].x.slice(); renderParetoPlot(); renderPick(); S.s7.fixed = pickX.slice(); renderS7(); };
  $('s7resp').onchange = e => { S.s7.resp = +e.target.value; s7sel = null; save(); drawContour(); };
  $('s7x').onchange = e => { S.s7.x = +e.target.value; s7sel = null; save(); renderS7(); };
  $('s7y').onchange = e => { S.s7.y = +e.target.value; s7sel = null; save(); renderS7(); };
  $('btnUseOpt').onclick = () => { if (pickX) { S.s7.fixed = pickX.slice(); s7sel = null; save(); renderS7(); } };
  $('btnExport').onclick = () => { $('exportArea').value = exportText(); };
  $('btnCopy').onclick = () => {
    const ta = $('exportArea'); if (!ta.value) ta.value = exportText();
    const done = () => $('copyMsg').textContent = T('copied');
    const manual = () => { ta.select(); $('copyMsg').textContent = T('copyManual'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, manual);
    else manual();
  };
  const rerenderCharts = () => { renderS2(); renderS3(); if (paretoRes) renderParetoPlot(); drawContour(); };
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderCharts); } catch (e) { }
  new MutationObserver(rerenderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function start() {
  S = load() || fromExample();
  if (S.source) S.source = 'example';
  localizeNames();
  refit(); bind(); renderAll();
  if (!window.Plotly) document.querySelectorAll('.plot').forEach(el => { el.innerHTML = `<p class="note">${T('noPlotly')}</p>`; el.style.minHeight = '0'; });
  runPareto();
}
start();
})();
</script>
